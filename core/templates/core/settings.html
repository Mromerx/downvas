{% extends "core/base.html" %}

{% block content %}
<h1>Canvas Settings</h1>

{% if messages %}
{% for msg in messages %}
<p style="color: {% if msg.tags == 'error' %}red{% else %}green{% endif %};">{{ msg }}</p>
{% endfor %}
{% endif %}

<form method="post" action="{% url 'settings' %}">
    {% csrf_token %}

    <div>
        <label for="id_canvas_url">{{ config_form.canvas_url.label }}</label>
        {{ config_form.canvas_url }}
    </div>

    <div>
        <label for="id_api_token">{{ config_form.api_token.label }}</label>
        {{ config_form.api_token }}
    </div>

    <div>
        <label for="id_locale">{{ config_form.locale.label }}</label>
        {{ config_form.locale }}
    </div>

    <button type="submit">Save</button>
</form>
{% endblock %}
